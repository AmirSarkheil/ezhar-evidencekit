[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ezhar-evidencekit"
version = "0.1.0"
description = "Vendor-neutral reproducible evidence packages for software and AI engineering workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Amir Mohammad Sarkheil", email = "a.sarkheil@ezhardynamics.com"}
]
keywords = ["evidence", "reproducibility", "ci", "integrity", "provenance", "ai-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
evidencekit = "evidencekit.cli:main"

[project.urls]
Homepage = "https://github.com/AmirSarkheil/ezhar-evidencekit"
Repository = "https://github.com/AmirSarkheil/ezhar-evidencekit"
Issues = "https://github.com/AmirSarkheil/ezhar-evidencekit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencekit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["examples/"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

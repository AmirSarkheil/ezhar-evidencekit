name: "EZHAR EvidenceKit"
description: "Collect, validate, verify, and upload a reproducible EvidenceKit package"
inputs:
  config:
    description: "Path to EvidenceKit config"
    required: false
    default: ".evidencekit/config.yml"
  python-version:
    description: "Python version used to run EvidenceKit"
    required: false
    default: "3.12"
  artifact-name:
    description: "Name of the uploaded GitHub Actions artifact"
    required: false
    default: "evidencekit-package"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install EvidenceKit
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: python -m pip install "$ACTION_ROOT/.."

    - name: Collect and verify evidence
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        evidencekit collect --config "$CONFIG"

        MANIFEST="$(
          python - "$CONFIG" <<'PY'
        from pathlib import Path
        import sys

        from evidencekit.config import load_config, resolve_manifest_path

        config_path = Path(sys.argv[1]).absolute()
        config = load_config(config_path)
        print(resolve_manifest_path(config_path, config))
        PY
        )"

        WORKSPACE="$(
          python - "$CONFIG" <<'PY'
        from pathlib import Path
        import sys

        from evidencekit.config import load_config, resolve_workspace

        config_path = Path(sys.argv[1]).absolute()
        config = load_config(config_path)
        print(resolve_workspace(config_path, config))
        PY
        )"

        evidencekit validate "$MANIFEST"
        evidencekit verify "$MANIFEST" --workspace "$WORKSPACE"

        OUTPUT_DIR=".evidencekit/action-output"
        OUTPUT_MANIFEST="$OUTPUT_DIR/evidence.json"
        OUTPUT_REPORT="$OUTPUT_DIR/evidence-report.md"
        mkdir -p "$OUTPUT_DIR"

        evidencekit report "$MANIFEST" \
          --format markdown \
          --output "$OUTPUT_REPORT"

        MANIFEST_REAL="$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve())' "$MANIFEST")"
        OUTPUT_REAL="$(python -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve())' "$OUTPUT_MANIFEST")"
        if [[ "$MANIFEST_REAL" != "$OUTPUT_REAL" ]]; then
          cp -- "$MANIFEST" "$OUTPUT_MANIFEST"
        fi

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          .evidencekit/action-output/evidence.json
          .evidencekit/action-output/evidence-report.md

name: Publish v0.1.0

on:
  pull_request:
    paths:
      - ".github/workflows/publish-v0.1.0.yml"
      - ".github/releases/v0.1.0-authorized"
      - "docs/release-notes-v0.1.0.md"
      - "scripts/verify_release.py"
      - "pyproject.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/releases/v0.1.0-authorized"

permissions:
  contents: read

concurrency:
  group: evidencekit-v0.1.0-publication-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  release-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify release authorization marker
        run: |
          set -euo pipefail
          grep -Fx "release=v0.1.0" .github/releases/v0.1.0-authorized
          grep -Fx "authorized=true" .github/releases/v0.1.0-authorized
          grep -Fx "authorized_by=AmirSarkheil" .github/releases/v0.1.0-authorized

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release verification
        run: python scripts/verify_release.py

      - name: Build clean distributions
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build

      - name: Create distribution checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate and verify release evidence
        run: |
          set -euo pipefail
          mkdir -p .evidencekit
          cat > .evidencekit/release.yml <<'YAML'
          schema_version: "1.0"
          workspace: "."
          manifest: "release-evidence.json"
          include:
            - "dist/*"
          exclude:
            - "**/.git/**"
            - "**/.evidencekit/**"
          max_artifact_bytes: 268435456
          junit: []
          YAML

          evidencekit collect --config .evidencekit/release.yml
          evidencekit validate release-evidence.json
          evidencekit verify release-evidence.json --config .evidencekit/release.yml
          evidencekit report release-evidence.json \
            --format markdown \
            --output release-evidence-report.md

          test -s dist/SHA256SUMS.txt
          test -s release-evidence.json
          test -s release-evidence-report.md

  publish:
    if: github.event_name == 'push' && github.repository == 'AmirSarkheil/ezhar-evidencekit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.1.0

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify release authorization marker
        run: |
          set -euo pipefail
          grep -Fx "release=v0.1.0" .github/releases/v0.1.0-authorized
          grep -Fx "authorized=true" .github/releases/v0.1.0-authorized
          grep -Fx "authorized_by=AmirSarkheil" .github/releases/v0.1.0-authorized

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run release verification
        run: python scripts/verify_release.py

      - name: Build clean distributions
        run: |
          set -euo pipefail
          rm -rf dist
          python -m build

      - name: Create distribution checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release evidence
        run: |
          set -euo pipefail
          mkdir -p .evidencekit
          cat > .evidencekit/release.yml <<'YAML'
          schema_version: "1.0"
          workspace: "."
          manifest: "release-evidence.json"
          include:
            - "dist/*"
          exclude:
            - "**/.git/**"
            - "**/.evidencekit/**"
          max_artifact_bytes: 268435456
          junit: []
          YAML

          evidencekit collect --config .evidencekit/release.yml
          evidencekit validate release-evidence.json
          evidencekit verify release-evidence.json --config .evidencekit/release.yml
          evidencekit report release-evidence.json \
            --format markdown \
            --output release-evidence-report.md

      - name: Create annotated release tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$EXISTING" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already exists at $EXISTING, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already points to the authorized release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "EZHAR EvidenceKit v0.1.0" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            release-evidence.json \
            release-evidence-report.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "EZHAR EvidenceKit v0.1.0" \
            --notes-file docs/release-notes-v0.1.0.md \
            --verify-tag

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

name: CI

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/evidencekit
      - run: pytest --cov=evidencekit --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/evidencekit-smoke
          /tmp/evidencekit-smoke/bin/pip install dist/*.whl
          /tmp/evidencekit-smoke/bin/evidencekit --help

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

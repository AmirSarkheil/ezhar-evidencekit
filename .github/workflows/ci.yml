name: CI

on:
  push:
    branches: ["main", "build/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/evidencekit
      - run: pytest --cov=evidencekit --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - name: Wheel smoke test
        run: |
          python -m venv /tmp/evidencekit-smoke
          /tmp/evidencekit-smoke/bin/pip install dist/*.whl
          /tmp/evidencekit-smoke/bin/evidencekit --help

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  quickstart-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Reproduce quickstart in a clean environment
        run: |
          python -m venv /tmp/evidencekit-quickstart
          /tmp/evidencekit-quickstart/bin/pip install dist/*.whl
          mkdir -p /tmp/evidencekit-demo
          cd /tmp/evidencekit-demo
          /tmp/evidencekit-quickstart/bin/evidencekit init
          mkdir -p artifacts
          printf 'example evidence\n' > artifacts/example.txt
          /tmp/evidencekit-quickstart/bin/evidencekit collect --config .evidencekit/config.yml
          /tmp/evidencekit-quickstart/bin/evidencekit validate evidence.json
          /tmp/evidencekit-quickstart/bin/evidencekit verify evidence.json
          /tmp/evidencekit-quickstart/bin/evidencekit report evidence.json --format markdown --output evidence-report.md
          test -f evidence.json
          test -f evidence-report.md

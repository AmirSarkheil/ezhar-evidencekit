name: Evidence Self Test

on:
  push:
    branches: ["main", "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Produce test evidence
        run: |
          mkdir -p artifacts
          pytest --junitxml=artifacts/pytest.xml
      - name: Configure EvidenceKit
        run: |
          mkdir -p .evidencekit
          cp examples/pytest-project/.evidencekit/config.yml .evidencekit/config.yml
      - run: evidencekit collect --config .evidencekit/config.yml
      - run: evidencekit validate evidence.json
      - run: evidencekit verify evidence.json
      - run: evidencekit report evidence.json --output evidence-report.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencekit-self-evidence
          path: |
            evidence.json
            evidence-report.md
            artifacts/pytest.xml

  composite-action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare custom-manifest configuration
        run: |
          mkdir -p artifacts .evidencekit
          printf 'action smoke evidence\n' > artifacts/action-smoke.txt
          cat > .evidencekit/action-test.yml <<'YAML'
          schema_version: "1.0"
          workspace: "."
          manifest: "reports/evidence.json"
          include:
            - "artifacts/**/*"
          exclude:
            - "**/.git/**"
            - "**/.evidencekit/**"
          max_artifact_bytes: 10485760
          junit: []
          YAML
      - name: Run local EvidenceKit action
        uses: ./action
        with:
          config: .evidencekit/action-test.yml
          python-version: "3.12"
      - name: Assert normalized action outputs
        run: |
          test -f reports/evidence.json
          test -f .evidencekit/action-output/evidence.json
          test -f .evidencekit/action-output/evidence-report.md

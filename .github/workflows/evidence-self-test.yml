name: Evidence Self Test

on:
  push:
    branches: ["main", "build/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Produce test evidence
        run: |
          mkdir -p artifacts
          pytest --junitxml=artifacts/pytest.xml
      - name: Configure EvidenceKit
        run: |
          mkdir -p .evidencekit
          cp examples/pytest-project/.evidencekit/config.yml .evidencekit/config.yml
      - run: evidencekit collect --config .evidencekit/config.yml
      - run: evidencekit validate evidence.json
      - run: evidencekit verify evidence.json
      - run: evidencekit report evidence.json --output evidence-report.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidencekit-self-evidence
          path: |
            evidence.json
            evidence-report.md
            artifacts/pytest.xml

  composite-action-default-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare default configuration
        run: |
          mkdir -p artifacts .evidencekit
          printf 'default action smoke evidence\n' > artifacts/action-default.txt
          cp examples/minimal/.evidencekit/config.yml .evidencekit/config.yml
      - name: Run local EvidenceKit action with defaults
        uses: ./action
        with:
          artifact-name: evidencekit-package-default
      - name: Assert default action outputs
        run: |
          test -f evidence.json
          test -f .evidencekit/action-output/evidence.json
          test -f .evidencekit/action-output/evidence-report.md

  composite-action-custom-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare custom-manifest configuration
        run: |
          mkdir -p artifacts .evidencekit
          printf 'custom action smoke evidence\n' > artifacts/action-smoke.txt
          cat > .evidencekit/action-test.yml <<'YAML'
          schema_version: "1.0"
          workspace: "."
          manifest: "reports/evidence.json"
          include:
            - "artifacts/**/*"
          exclude:
            - "**/.git/**"
            - "**/.evidencekit/**"
          max_artifact_bytes: 10485760
          junit: []
          YAML
      - name: Run local EvidenceKit action with custom manifest
        uses: ./action
        with:
          config: .evidencekit/action-test.yml
          python-version: "3.12"
          artifact-name: evidencekit-package-custom
      - name: Assert normalized action outputs
        run: |
          test -f reports/evidence.json
          test -f .evidencekit/action-output/evidence.json
          test -f .evidencekit/action-output/evidence-report.md
